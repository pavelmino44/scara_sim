# ============================================================
# Параметры двигателей постоянного тока с редукторами
#
# Ключ "/**" - параметры доступны всем нодам, которым передан
# этот файл: dc_motor_sim (модель привода) и pid_controller
# (обратная модель для прямой связи по напряжению).
#
# Значения - списки по числу сочленений (joint1, joint2).
# ВАЖНО: все числа пишите с точкой (50.0, а не 50),
# иначе ROS посчитает массив целочисленным.
#
# Условный ДПТ 24 В с постоянными магнитами:
#   R = 2 Ом, L = 1 мГн (L/R = 0.5 мс), kt = ke = 0.05 Н·м/А
#   J_rotor = 5e-6 кг·м²
# Редукторы: N = 50 (joint1), N = 30 (joint2), КПД 0.9.
#
# Получаемые характеристики на шарнире (выводятся при запуске):
#   пусковой момент   eta*N*kt*U_max/R : 27.0 / 16.2 Н·м
#   скорость х.х.     U_max/(ke*N)     :  9.6 / 16.0 рад/с
#   приведённая инерция ротора N²*J_r  : 0.0125 / 0.0045 кг·м²
# ============================================================

/**:
  ros__parameters:
    joint_names: ["joint1", "joint2"]

    motor:
      R:          [2.0, 2.0]          # сопротивление якоря, Ом
      L:          [1.0e-3, 1.0e-3]    # индуктивность якоря, Гн
      kt:         [0.05, 0.05]        # моментная постоянная, Н·м/А
      ke:         [0.05, 0.05]        # постоянная противо-ЭДС, В·с/рад
      J_rotor:    [5.0e-6, 5.0e-6]    # момент инерции ротора, кг·м²
      b_motor:    [1.0e-6, 1.0e-6]    # вязкое трение в двигателе, Н·м·с/рад
      gear_ratio: [50.0, 30.0]        # передаточное число редуктора N
      gear_eff:   [0.9, 0.9]          # КПД редуктора
      U_max:      [24.0, 24.0]        # напряжение питания (насыщение усилителя), В
