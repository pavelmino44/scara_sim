# ============================================================
# ПИД-регулятор положения, управление ДПТ по напряжению
#
#   U = U_ff + Kp*e + Ki*int(e) + Kd*e_dot      [В]
#
# Подобрано на офлайн-модели (offline_pid_sim --actuator motor):
#   ff+pid: RMS ошибки схвата ~0.11 мм,
#   устойчиво при задержке измерения до 20 мс.
#
# Параметры двигателей - в dc_motors.yaml.
# Порядок значений соответствует joint_names.
# ============================================================

pid_controller:
  ros__parameters:
    use_sim_time: true

    link_lengths: [0.40, 0.30]

    actuator: "motor"
    # ff | pid | ff+pid
    mode: "ff+pid"

    kp: [300.0, 100.0]      # В/рад
    ki: [300.0, 100.0]      # В/(рад·с)
    kd: [8.0, 3.0]          # В·с/рад

    integral_limit: [0.05, 0.05]   # рад·с
    output_limit: [24.0, 24.0]     # В

    control_rate: 1000.0    # Гц
    start_delay: 1.0        # с, удержание начальной точки перед стартом
    hold_after: 1.0         # с, запись лога после окончания траектории

    # Пусто -> share/scara_sim/data/trajectory.csv
    trajectory_file: ""
    # Пусто -> share/scara_sim/data/pid_log_<actuator>_<mode>_<время>.csv
    log_file: ""

dc_motor_sim:
  ros__parameters:
    use_sim_time: true
    rate: 1000.0
    command_timeout: 0.1           # с, без команд -> U = 0
    include_rotor_inertia: true    # учитывать N²*J_r*q_ddot
    accel_cutoff_hz: 100.0         # фильтр оценки ускорения
